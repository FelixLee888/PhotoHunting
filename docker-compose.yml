services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/photohunting.db}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-photohunting}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/media}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./backend/data:/app/data
      - /Volumes/Public:/media/public:ro
    ports:
      - "${PHOTOHUNTING_BACKEND_PORT:-8000}:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${PHOTOHUNTING_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  qdrant_storage:
